[workspace]
members = [".", "xtask"]

[package]
name = "bare"
version = "0.5.0"
edition = "2024"
description = "A minimal, fast, private web browser built on Chromium (CEF). No bloat."
license = "MIT"
repository = "https://github.com/sai113/Bare"
homepage = "https://github.com/sai113/Bare"
readme = "README.md"

# On Windows the sandboxed build is a DLL loaded by CEF's bootstrap.exe (renamed to Bare.exe).
[lib]
crate-type = ["cdylib"]

# Linux/macOS, and Windows without the sandbox (`--no-default-features`), use a normal executable.
[[bin]]
name = "bare"
path = "src/main.rs"

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]

[dependencies]
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
cef = { version = "=154.5.0", default-features = false }
ed25519-dalek = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
