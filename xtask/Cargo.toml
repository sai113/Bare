[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
description = "Build helper: packages Bare with its Chromium (CEF) runtime into dist/Bare."

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dependencies]
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11.1"
