name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # CMake is preinstalled on the runner; CEF's C++ wrapper also needs Ninja.
      - name: Install Ninja
        run: choco install ninja --no-progress -y

      # The Chromium (CEF) runtime is ~170 MB to download; keep it between runs.
      - name: Cache Chromium (CEF)
        uses: actions/cache@v4
        with:
          path: vendor/cef
          key: cef-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test -p bare --bin bare --no-default-features

      - name: Build the sandboxed browser (what users get)
        run: cargo build --release -p bare --lib

      - name: Build the release tool
        run: cargo build --release -p xtask
